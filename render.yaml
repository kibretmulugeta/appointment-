services:
  - type: web
    name: scheduler-app
    env: python
    buildCommand: "pip install -r scheduler/backend/requirements.txt && cd scheduler/frontend && npm install && npm run build"
    startCommand: "cd scheduler/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
